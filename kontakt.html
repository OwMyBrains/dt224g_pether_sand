    <main>
        <h2>Kontakta mig</h2>
        <form>
            <label for="name">Namn:</label>
            <br>
            <input type="text" id="name" name="name" required>
            <br>
            <label for="email">Epost:</label>
            <br>
            <input type="email" name="email" id="email" required>
            <br>
            <label for="phone">Telefonnummer:</label>
            <br>
            <input id="phone" type="tel" name="phone">
            <br>
            <label for="question">Fråga:</label>
            <br>
            <textarea id="question" name="question" cols="35" rows="5" required></textarea>
            <br>
            <input type="submit" value="Skicka">
        </form>
        <br>
        Använd formuläret ovan eller skicka ett mail till <a
            href="mailto:pesa2600@student.miun.se">pesa2600@student.miun.se</a><br>
        <br>
